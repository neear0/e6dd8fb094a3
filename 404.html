<style>
:root{--bg:#F3F4F2;--ink:#22262A;--muted:#62676C;--red:#D7182A;--green:#5E9F33;--blue:#1F4E9C}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Archivo",system-ui,sans-serif;padding:24px}
main{max-width:640px}
.mark{display:flex;gap:4px;margin-bottom:32px}
.mark i{width:14px;height:14px}
h1{font-variation-settings:"wdth" 118;font-weight:850;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.02;margin:0 0 18px;text-wrap:balance}
p{color:var(--muted);margin:0 0 28px}
a{display:inline-block;padding:14px 22px;background:var(--ink);color:#fff;font-weight:700;text-decoration:none}
a:hover{background:var(--red)}
a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
</style>
</head>

<main>
  <div class="mark" aria-hidden="true"><i style="background:var(--red)"></i><i style="background:var(--green)"></i><i style="background:var(--blue)"></i></div>
